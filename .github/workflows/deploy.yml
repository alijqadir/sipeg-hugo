name: Build and Deploy to Hostinger

on:
  push:
    branches:
      - master

# Only one deploy at a time; a queued push should not interleave FTP syncs.
concurrency:
  group: sipeg-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.150.0"
          extended: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      # Guard: a missing section index silently produces Hostinger 403s.
      - name: Verify critical pages exist
        run: |
          set -e
          for f in index.html events/index.html blog/index.html research/index.html search/index.html; do
            if [ ! -f "public/$f" ]; then
              echo "::error::Missing build output: public/$f"
              exit 1
            fi
          done
          echo "Critical pages present."

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || 21 }}
          protocol: ftp
          timeout: 60000
          log-level: verbose
          server-dir: ${{ secrets.FTP_PATH }}
          local-dir: public/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-202602.json
          exclude: |
            **/.git*
            **/.git*/**
            forms/data/**
            forms/data/**/*
            research/identity-culture-governance-societal-cleavages-national-harmony/**
