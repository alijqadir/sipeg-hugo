name: Build & Deploy (Hostinger SFTP)

on:
  push:
    branches: [ master ]
  workflow_dispatch: {}

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy to Hostinger via SCP (SFTP)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "public/*"
          target: ${{ secrets.HOSTINGER_TARGET_DIR }}
          overwrite: true

      # Optional: remove old files that no longer exist in the new build.
      # SCP overwrite does not delete removed files. If you need perfect sync,
      # we can switch to an rsync-based deployment (requires SSH key auth).
